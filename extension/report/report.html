<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reality Check report</title>
<link rel="icon" href="../icons/icon32.png">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#fff;color:#111;font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  .top{border-bottom:1px solid #e6e6e6}
  .top .in{max-width:760px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:9px;font-weight:600}
  main{max-width:760px;margin:0 auto;padding:40px 24px 80px}
  .eyebrow{font-size:12.5px;color:#6b6b6b}
  .addr{font-size:15px;color:#444;margin-top:2px}
  h1{font-size:24px;line-height:1.35;font-weight:600;margin:14px 0 0;letter-spacing:-.01em}
  .note{font-size:12.5px;color:#6b6b6b;margin-top:8px}
  .counts{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid #e6e6e6;border-radius:10px;margin-top:28px}
  .cnt{padding:14px 16px;border-left:1px solid #e6e6e6}
  .cnt:first-child{border-left:0}
  .cnt b{display:block;font-size:20px;font-weight:600}
  .cnt span{font-size:12.5px;color:#6b6b6b}
  .d{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:1px}
  h2{font-size:13px;font-weight:500;color:#6b6b6b;margin:40px 0 4px}
  .claim{border-bottom:1px solid #e6e6e6;padding:18px 0;display:grid;grid-template-columns:16px 1fr auto;gap:0 12px}
  .claim .d{margin-top:8px}
  .q{font-size:15px;font-weight:500}
  .q small{font-size:12.5px;color:#6b6b6b;font-weight:400;margin-left:8px}
  .vl{font-size:13px}
  dl{display:grid;grid-template-columns:110px 1fr;gap:4px 12px;margin:10px 0 0;font-size:13.5px}
  dt{color:#6b6b6b} dd{margin:0}
  .reason{color:#444;margin:10px 0 0;font-size:13.5px}
  img{max-width:100%;border:1px solid #e6e6e6;border-radius:8px;margin-top:12px}
</style>
</head>
<body>
<div class="top"><div class="in"><svg viewBox="0 0 24 24" width="20" height="20"><circle cx="12" cy="12" r="9.5" fill="none" stroke="#2563eb" stroke-width="2"/><path d="M7.8 12.4l2.9 2.9 5.6-5.9" fill="none" stroke="#2563eb" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></svg>Reality Check</div></div>
<main id="main"></main>
<script src="../sample_events.js"></script>
<script src="report.js"></script>
</body>
</html>
